# Illustrative parameters only; the Python demo does not require a YAML loader.
seed: 42
embedding_dim: 8
confidence_threshold: 0.90

modalities:
  macro:
    feature_dim: 6
    noise: 0.30
    cost: 1.0
  spectral:
    feature_dim: 8
    noise: 0.15
    cost: 2.0
  microscopy_low:
    feature_dim: 10
    noise: 0.10
    cost: 3.0
  microscopy_high:
    feature_dim: 12
    noise: 0.05
    cost: 6.0

# The generator's fixed signal strengths and encoder geometry are declared in
# its Python API. These settings neither train models nor read measurements.
